<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F2EE;
  --surface: #FFFFFF;
  --surface2: #EFEDE8;
  --border: rgba(0,0,0,0.09);
  --border2: rgba(0,0,0,0.16);
  --text: #1C1B18;
  --text2: #6B6860;
  --text3: #A8A69F;
  --accent: #4338CA;
  --accent-bg: #EEF2F6;
  --accent-mid: #6366F1;
  --green: #166534;
  --green-bg: #DCFCE7;
  --red: #991B1B;
  --red-bg: #FEE2E2;
  --yellow-bg: #FEF9C3;
  --yellow: #854D0E;
  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --font: 'DM Sans', 'Noto Sans KR', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

#app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
}

.screen { display: none; animation: fadeUp 0.22s ease; }
.screen.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 18px 4px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
}
.topbar h2 { font-size: 17px; font-weight: 700; flex: 1; }
.back-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border2);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text2); font-size: 16px;
}

.home-header {
  padding: 20px 18px 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
}
.home-header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.home-header p { font-size: 13px; color: var(--text2); margin-top: 2px; }

.tab-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 0 18px 14px;
  scrollbar-width: none;
}
.tab-row::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0; padding: 8px 14px; text-align: center;
  font-size: 13px; font-weight: 700; color: var(--text2);
  background: var(--surface); border: 1px solid var(--border2); border-radius: 99px;
  cursor: pointer; transition: all 0.15s;
}
.tab-btn.active {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
}
.tab-btn.wrong-tab {
  border-color: #FCA5A5;
  color: var(--red);
}
.tab-btn.wrong-tab.active {
  background: #DC2626;
  border-color: #DC2626;
  color: #ffffff;
}

.voice-row { display: flex; gap: 6px; padding: 0 18px 16px; }
.voice-btn {
  flex: 1; padding: 9px;
  border-radius: var(--radius-xs); border: 1px solid var(--border2);
  background: var(--surface); font-size: 12px; font-weight: 700;
  font-family: var(--font); cursor: pointer; color: var(--text2);
}
.voice-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 0 18px;
}
.mc {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 16px 14px 14px;
  cursor: pointer;
  transition: transform 0.12s;
}
.mc:active { transform: scale(0.97); }
.mc-full { grid-column: span 2; }
.mc-hl { background: var(--accent); border-color: var(--accent); color: #fff; }
.mc-hl .mc-desc { color: rgba(255,255,255,0.65); }
.mc-icon { font-size: 22px; margin-bottom: 8px; }
.mc-label { font-size: 14px; font-weight: 700; }
.mc-desc { font-size: 11px; color: var(--text3); margin-top: 2px; }

.prog-track { height: 4px; background: var(--surface2); border-radius: 99px; margin: 0 18px 20px; overflow: hidden; }
.prog-fill { height: 4px; background: var(--accent-mid); width: 0%; transition: width 0.3s ease; }

.card-box {
  background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
  padding: 34px 24px; margin: 0 18px 16px; text-align: center;
}
.card-hint { font-size: 12px; color: var(--text3); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
.card-word { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.4; }
.tts-btn { background: none; border: none; cursor: pointer; font-size: 20px; margin-left: 6px; vertical-align: middle; }

.blank-input {
  width: calc(100% - 36px); margin: 0 18px 10px; padding: 15px 18px;
  border: 2px solid var(--border2); border-radius: var(--radius-sm);
  font-size: 18px; font-weight: 700; font-family: var(--font); text-align: center; outline: none; background: var(--surface);
}
.blank-input.correct { 
  border-color: #16A34A; 
  background: var(--green-bg);
  animation: blinkCorrectBlock 0.25s linear 2;
}
.blank-input.wrong { 
  border-color: #DC2626; 
  background: var(--red-bg);
  animation: blinkWrongBlock 0.25s linear 2;
}

.quiz-opts { padding: 0 18px; }
.qopt {
  padding: 15px 18px; background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); margin-bottom: 8px; cursor: pointer; font-size: 15px; font-weight: 500;
}
.qopt.correct { 
  background: var(--green-bg); color: var(--green); border-color: #86EFAC; 
  animation: blinkCorrectBlock 0.25s linear 2;
}
.qopt.wrong { 
  background: var(--red-bg); color: var(--red); border-color: #FCA5A5; 
  animation: blinkWrongBlock 0.25s linear 2;
}
.qopt.reveal { background: var(--yellow-bg); color: var(--yellow); border-color: #FDE047; }

@keyframes blinkCorrectBlock {
  0%, 100% { background: var(--green-bg); }
  50% { background: #FFFFFF; }
}
@keyframes blinkWrongBlock {
  0%, 100% { background: var(--red-bg); }
  50% { background: #FFFFFF; }
}

.action-btn {
  display: block; width: calc(100% - 36px); margin: 0 18px; padding: 15px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; cursor: pointer;
}
.feedback-row { min-height: 28px; text-align: center; font-size: 13px; color: var(--text3); margin: 0 18px 8px; }

.result-hero { text-align: center; padding: 30px 18px 20px; }
.result-pct { font-size: 56px; font-weight: 700; color: var(--accent); }
.result-sub { font-size: 16px; color: var(--text2); margin-top: 4px; }
.result-table { width: calc(100% - 36px); margin: 0 18px; border-collapse: collapse; font-size: 14px; }
.result-table td { padding: 11px 10px; border-bottom: 1px solid var(--border); }
.result-table .ok { color: var(--green); font-weight: 700; }
.result-table .ng { color: var(--red); font-weight: 700; }

.word-list-header { 
  padding: 16px 18px 8px; 
  font-size: 12px; 
  font-weight: 700; 
  color: var(--text3); 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
}
.word-row { display: flex; align-items: center; padding: 11px 18px; border-bottom: 1px solid var(--border); gap: 10px; }
.w-en { font-size: 14px; font-weight: 700; flex: 1; }
.w-ko { font-size: 13px; color: var(--text2); flex: 1.2; }
.del-btn {
  background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; padding: 4px;
}
.del-btn:hover { color: var(--red); }
.list-card { margin: 0 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

.answer-box { display: none; margin: 0 18px 10px; padding: 14px; background: var(--yellow-bg); border-radius: var(--radius-sm); text-align: center; border: 1px solid #FDE047; }
.answer-box h3 { font-size: 20px; font-weight: 700; color: var(--yellow); }

.diff-box {
  margin-bottom: 12px;
  padding: 10px 14px;
  background: #FFFFFF;
  border-radius: var(--radius-xs);
  border: 1px solid rgba(0,0,0,0.08);
  font-size: 14px;
  text-align: left;
  line-height: 1.6;
}
.diff-row { margin-bottom: 4px; }
.diff-row:last-child { margin-bottom: 0; }
.diff-label { font-size: 11px; font-weight: 700; color: var(--text3); margin-bottom: 2px; }
.diff-text { font-family: var(--font); font-size: 16px; font-weight: 700; word-break: break-all; }
.diff-wrong {
  color: #DC2626;
  background: #FEE2E2;
  border-radius: 4px;
  padding: 1px 3px;
  font-weight: 700;
  text-decoration: underline;
}
.diff-correct {
  color: #166534;
  background: #DCFCE7;
  border-radius: 4px;
  padding: 1px 3px;
  font-weight: 700;
}
</style>
</head>
<body>
<div id="app">

<div id="homeScreen" class="screen active">
  <div class="home-header">
    <h1>교재 핵심 단어장 ✦</h1>
    <p id="homeSub">로딩 중...</p>
  </div>

  <div class="tab-row" id="tabContainer"></div>

  <div class="voice-row">
    <button class="voice-btn active" id="vf" onclick="setVoice('female')">👩 여성 음성</button>
    <button class="voice-btn" id="vm" onclick="setVoice('male')">👨 남성 음성</button>
  </div>

  <div class="menu-grid">
    <div class="mc mc-hl" onclick="startMode('super_en_ko')">
      <div class="mc-icon">🚀</div>
      <div class="mc-label">주관식 (영➔한)</div>
      <div class="mc-desc">뜻 직접 입력 (절반 이상 일치)</div>
    </div>
    <div class="mc mc-hl" onclick="startMode('super_ko_en')">
      <div class="mc-icon">✍️</div>
      <div class="mc-label">주관식 (한➔영)</div>
      <div class="mc-desc">스펠링 직접 타이핑 (절반 이상 일치)</div>
    </div>
    <div class="mc" style="background:var(--accent-bg); border-color:#C7D2FE" onclick="startMode('quiz_en_ko')">
      <div class="mc-icon">✅</div>
      <div class="mc-label">객관식 (영➔한)</div>
      <div class="mc-desc">뜻 고르기 · 10초 제한시간</div>
    </div>
    <div class="mc" style="background:var(--accent-bg); border-color:#C7D2FE" onclick="startMode('quiz_ko_en')">
      <div class="mc-icon">🔤</div>
      <div class="mc-label">객관식 (한➔영)</div>
      <div class="mc-desc">단어 고르기 · 10초 제한시간</div>
    </div>
    <div class="mc mc-full" onclick="goManage()">
      <div class="mc-icon">📝</div>
      <div class="mc-label">현재 탭 단어 목록 보기</div>
      <div class="mc-desc">선택된 단어 리스트 전체 확인</div>
    </div>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="confirmExit()">←</button>
    <h2 id="gameTitle">학습 중</h2>
    <span id="gameCounter" style="font-size:12px; color:var(--text3); font-weight:700"></span>
  </div>
  <div class="prog-track"><div id="gameBar" class="prog-fill"></div></div>
  <div id="gameArea"></div>
</div>

<div id="resultScreen" class="screen">
  <div class="topbar"><h2>결과</h2></div>
  <div class="result-hero">
    <div class="result-pct" id="resPct">0%</div>
    <div class="result-sub" id="resScore"></div>
  </div>
  <div class="list-card" style="margin-bottom: 16px; max-height: 260px; overflow-y: auto;">
    <table class="result-table" id="reportTable"></table>
  </div>
  <div id="retryWrongBox" style="margin-bottom: 8px;"></div>
  <button class="action-btn" onclick="showHome()">홈으로</button>
  <div style="height:32px"></div>
</div>

<div id="manageScreen" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showHome()">←</button>
    <h2>단어 목록</h2>
  </div>
  <div class="word-list-header">
    <span id="listHeader">단어 리스트</span>
    <span id="clearAllWrongBtn" style="display:none; cursor:pointer; color:var(--red); font-weight:700; font-size:12px;" onclick="clearAllWrongWords()">전체 삭제</span>
  </div>
  <div class="list-card" style="max-height: 70vh; overflow-y: auto;">
    <div id="wordListEl"></div>
  </div>
  <div style="height:40px"></div>
</div>

</div>

// 로컬스토리지 오답 관리
function getSavedWrongWords() {
  try {
    return JSON.parse(localStorage.getItem('savedWrongWords') || '[]');
  } catch(e) { return []; }
}
function saveWrongWords(list) {
  localStorage.setItem('savedWrongWords', JSON.stringify(list));
}
function addWrongWord(wordObj) {
  const list = getSavedWrongWords();
  if (!list.some(w => w.en === wordObj.en)) {
    list.push(wordObj);
    saveWrongWords(list);
  }
}
function removeWrongWord(enStr) {
  let list = getSavedWrongWords();
  list = list.filter(w => w.en !== enStr);
  saveWrongWords(list);
  renderWordList();
  renderTabs();
  updateHomeSubCount();
}
function clearAllWrongWords() {
  if (confirm('오답노트를 모두 비울까요?')) {
    saveWrongWords([]);
    renderWordList();
    renderTabs();
    updateHomeSubCount();
  }
}

  if (currentWeekTab === '🚨 오답노트') {
    return getSavedWrongWords();
  }
  return baseWordData[currentWeekTab] || [];
}

let AC = null;
function initAudio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC && AC.state === 'suspended') AC.resume();
}
document.body.addEventListener('touchstart', initAudio, { once: true });

function playBeep(ok) {
  try {
    initAudio(); if (!AC) return;
    const now = AC.currentTime;
    if (ok) {
      const freqs = [392.00, 523.25, 659.25]; 
      freqs.forEach((f, i) => {
        const o = AC.createOscillator(), g = AC.createGain();
        o.frequency.setValueAtTime(f, now + i*0.08);
        g.gain.setValueAtTime(0, now+i*0.08);
        g.gain.linearRampToValueAtTime(0.04, now+i*0.08+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now+i*0.08+0.15);
        o.connect(g); g.connect(AC.destination);
        o.start(now+i*0.08); o.stop(now+i*0.08+0.15);
      });
    } else {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(180, now);
      g.gain.setValueAtTime(0.04, now);
      g.gain.linearRampToValueAtTime(0.001, now+0.4);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(now+0.4);
    }
  } catch(e){}
}

function speak(text) {
  try {
    window.speechSynthesis.cancel();
    if (!text) return;

    // 1. sth, sb, to V 축약어를 실제 발음 단어로 확실하게 변환
    // 단어 앞뒤에 공백이나 문장부호가 있거나 문자열 시작/끝일 때 모두 대응
    let spokenText = text
      .replace(/(^|[^a-zA-Z])sth($|[^a-zA-Z])/gi, '$1something$2')
      .replace(/(^|[^a-zA-Z])sb($|[^a-zA-Z])/gi, '$1somebody$2')
      .replace(/(^|[^a-zA-Z])to\s*V($|[^a-zA-Z])/gi, '$1to do$2');

    // 양 끝 불필요한 공백 정리
    spokenText = spokenText.trim();

    const u = new SpeechSynthesisUtterance(spokenText);
    u.lang = 'en-US'; 
    u.rate = 0.85; 
    u.pitch = 1.0;
    
    // 디버깅용: 실제 TTS로 넘어가는 텍스트를 콘솔에서 확인 가능
    console.log("TTS 발음 원문:", text, "➔ 변환 후:", spokenText);

    const vv = speechSynthesis.getVoices();
    const pick = selectedVoice === 'female'
      ? vv.find(v => v.lang.startsWith('en') && (v.name.includes('Samantha') || (v.name.includes('Google') && !v.name.toLowerCase().includes('male'))))
      : vv.find(v => v.lang.startsWith('en') && (v.name.includes('Daniel') || v.name.toLowerCase().includes('male')));
    if (pick) u.voice = pick;

    window.speechSynthesis.speak(u);
  } catch(e) {
    console.error("TTS 에러:", e);
  }
}

function renderTabs() {
  const container = document.getElementById('tabContainer');
  if(!container) return;
  container.innerHTML = '';
  
  const allTabs = [...Object.keys(baseWordData), '🚨 오답노트'];
  allTabs.forEach(key => {
    const btn = document.createElement('button');
    const isWrong = key === '🚨 오답노트';
    btn.className = `tab-btn ${isWrong ? 'wrong-tab' : ''} ${key === currentWeekTab ? 'active' : ''}`;
    btn.textContent = key;
    btn.onclick = () => {
      initAudio();
      currentWeekTab = key;
      renderTabs();
      updateHomeSubCount();
    };
    container.appendChild(btn);
  });
}

function updateHomeSubCount() {
  const count = getActivePool().length;
  const el = document.getElementById('homeSub');
  if(el) el.textContent = `${currentWeekTab} 단어 수: 총 ${count}개`;
}

function setVoice(t) {
  selectedVoice = t; localStorage.setItem('prefVoice', t);
  document.getElementById('vf').classList.toggle('active', t==='female');

}

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

    `<div class="word-row">
      <span class="w-en">${w.en}</span>
      <span class="w-ko">${w.ko}</span>
      ${isWrongTab ? `<button class="del-btn" title="오답노트에서 삭제" onclick="removeWrongWord('${w.en.replace(/'/g,"\\'")}')">✕</button>` : ''}
    </div>`
  ).join('');
}

function startMode(mode, customPool = null) {
  initAudio();
  modeType = mode;
  const activePool = customPool || getActivePool();
  
  if (activePool.length === 0) {
    alert('학습할 단어가 없습니다.');
    return;
  }
  
  currentWords = shuffle([...activePool]);
  idx = 0; score = 0; reports = []; lock = false;
  showScreen('gameScreen'); renderQ();
}

function shuffle(a) {
  for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getAllGlobalWords() {
  let all = [];
  Object.values(baseWordData).forEach(arr => { all = all.concat(arr); });
  return all;
}

function renderQ() {
  lock = false;
  if (quizTimer) { clearTimeout(quizTimer); quizTimer = null; }
  if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
  
  const w = currentWords[idx];
  let distractorPool = getActivePool();
  if (distractorPool.length < 4) {
    distractorPool = getAllGlobalWords();
  }
  
  document.getElementById('gameBar').style.width = ((idx+1)/currentWords.length*100)+'%';
  
  const titleMap = {
    super_en_ko: '주관식 (영➔한)',
    super_ko_en: '주관식 (한➔영)',
    quiz_en_ko: '객관식 (영➔한)',
    quiz_ko_en: '객관식 (한➔영)'
  };
  document.getElementById('gameTitle').textContent = `[${currentWeekTab}] ` + (titleMap[modeType] || '학습');
  document.getElementById('gameCounter').textContent = `${idx+1} / ${currentWords.length}`;
  const area = document.getElementById('gameArea');
  area.innerHTML = '';

  if (modeType === 'super_en_ko') {
    qSide = 'en';
    area.innerHTML = `
      <div class="card-box">
        <div class="card-hint">한국어 뜻을 입력하세요</div>
        <div class="card-word">${w.en} <button class="tts-btn" onclick="speak('${w.en.replace(/'/g,"\\'")}')">🔊</button></div>
      </div>
      <div class="feedback-row" id="fb"></div>
      <input class="blank-input" id="si" type="text" placeholder="정답을 모르겠으면 바로 확인을 누르세요" autocomplete="off" spellcheck="false" onkeyup="if(event.key==='Enter')checkSuper()">
      <button class="action-btn" id="checkBtn" onclick="checkSuper()">정답 확인</button>
      <div class="answer-box" id="ansBox">
        <div id="diffArea"></div>
        <div style="font-size:12px;color:var(--yellow);font-weight:700;margin-bottom:4px">정답 교재 표기</div>
        <h3>${w.ko}</h3>
        <button class="action-btn" style="margin-top:12px;background:var(--green);padding:11px" onclick="moveNext()">다음 →</button>
      </div>`;
    setTimeout(() => { try { document.getElementById('si')?.focus(); } catch(e){} }, 250);
    speak(w.en);
  }
  else if (modeType === 'super_ko_en') {
    qSide = 'ko';
    area.innerHTML = `
      <div class="card-box">
        <div class="card-hint">영어 단어/숙어를 입력하세요</div>
        <div class="card-word" style="font-size:20px; font-weight:500; word-break:keep-all;">${w.ko}</div>
      </div>
      <div class="feedback-row" id="fb"></div>
      <input class="blank-input" id="si" type="text" placeholder="정답을 모르겠으면 바로 확인을 누르세요" autocomplete="off" spellcheck="false" onkeyup="if(event.key==='Enter')checkSuper()">
      <button class="action-btn" id="checkBtn" onclick="checkSuper()">정답 확인</button>
      <div class="answer-box" id="ansBox">
        <div id="diffArea"></div>
        <div style="font-size:12px;color:var(--yellow);font-weight:700;margin-bottom:4px">정답 교재 표기</div>
        <h3>${w.en}</h3>
        <button class="action-btn" style="margin-top:12px;background:var(--green);padding:11px" onclick="moveNext()">다음 →</button>
      </div>`;
    setTimeout(() => { try { document.getElementById('si')?.focus(); } catch(e){} }, 250);
  }
  else if (modeType === 'quiz_en_ko') {
    const distractors = shuffle(distractorPool.filter(x=>x.en!==w.en)).slice(0,3).map(x=>x.ko);
    const opts = shuffle([...new Set([w.ko, ...distractors])]);
    area.innerHTML = `
      <div class="card-box">
        <div class="card-hint" id="timerHint">올바른 뜻을 고르세요 (제한시간 10초)</div>
        <div class="card-word" style="font-size:24px;">${w.en} <button class="tts-btn" onclick="speak('${w.en.replace(/'/g,"\\'")}')">🔊</button></div>
      </div>
      <div class="quiz-opts" id="qOpts"></div>`;
    const el = document.getElementById('qOpts');
    opts.forEach(o => {
      const b = document.createElement('div');
      b.className = 'qopt'; b.textContent = o;
      if (o===w.ko) b.id = 'correctOpt';
      b.onclick = () => { handleQuizSelect(b, o, w.ko); };
      el.appendChild(b);
    });
    speak(w.en);
    countdownTimer = setTimeout(handleQuizTimeout, 10000);
  }
  else if (modeType === 'quiz_ko_en') {
    const distractors = shuffle(distractorPool.filter(x=>x.en!==w.en)).slice(0,3).map(x=>x.en);
    const opts = shuffle([...new Set([w.en, ...distractors])]);
    area.innerHTML = `
      <div class="card-box">
        <div class="card-hint" id="timerHint">올바른 단어/숙어를 고르세요 (제한시간 10초)</div>
        <div class="card-word" style="font-size:20px; font-weight:500; word-break:keep-all;">${w.ko}</div>
      </div>
      <div class="quiz-opts" id="qOpts"></div>`;
    const el = document.getElementById('qOpts');
    opts.forEach(o => {
      const b = document.createElement('div');
      b.className = 'qopt'; b.textContent = o;
      if (o===w.en) b.id = 'correctOpt';
      b.onclick = () => { handleQuizSelect(b, o, w.en); };
      el.appendChild(b);
    });
    countdownTimer = setTimeout(handleQuizTimeout, 10000);
  }
}

function cleanText(str) {
  if(!str) return '';
  return str.toLowerCase().replace(/['"’`_➔~.,?!\s\(\)]/g, '');
}

function checkSimilarity(user, target) {
  const u = cleanText(user);
  const t = cleanText(target);
  if (!u || !t) return false;
  if (u === t) return true; 

  if (t.length >= 2 && u.length <= 1) return false;

  let matchCount = 0;
  for (let i = 0; i < u.length; i++) {
    if (t.includes(u[i])) {
      matchCount++;
    }
  }

  const threshold = t.length / 2;
  return matchCount >= threshold;
}

function getCharDiff(userStr, targetStr) {
  const s1 = userStr;
  const s2 = targetStr;
  const n = s1.length;
  const m = s2.length;
  
  const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < m; j++) {
      if (s1[i].toLowerCase() === s2[j].toLowerCase()) {
        dp[i + 1][j + 1] = dp[i][j] + 1;
      } else {
        dp[i + 1][j + 1] = Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
  }
  
  let i = n, j = m;
  let userArr = [], targetArr = [];
  
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && s1[i - 1].toLowerCase() === s2[j - 1].toLowerCase()) {
      userArr.unshift({ char: s1[i - 1], type: 'match' });
      targetArr.unshift({ char: s2[j - 1], type: 'match' });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
      targetArr.unshift({ char: s2[j - 1], type: 'add' });
      j--;
    } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
      userArr.unshift({ char: s1[i - 1], type: 'wrong' });
      i--;
    }
  }
  
  const userHtml = userArr.map(d => 
    d.type === 'wrong' ? `<span class="diff-wrong">${d.char === ' ' ? '&nbsp;' : d.char}</span>` : d.char
  ).join('');
  
  const targetHtml = targetArr.map(d => 
    d.type === 'add' ? `<span class="diff-correct">${d.char === ' ' ? '&nbsp;' : d.char}</span>` : d.char
  ).join('');
  
  return { userHtml, targetHtml };
}

function checkSuper() {
  if (lock) return;
  const inp = document.getElementById('si');
  if(!inp) return;
  
  const rawVal = inp.value.trim();
  const w = currentWords[idx];
  const targetAnswer = (qSide === 'en') ? w.ko : w.en;
  const diffArea = document.getElementById('diffArea');
  if (diffArea) diffArea.innerHTML = '';
  
  if (rawVal === "") {
    lock = true;
    inp.classList.add('wrong');
    playBeep(false);
    
    document.getElementById('checkBtn').style.display = 'none';
    inp.disabled = true;
    document.getElementById('ansBox').style.width = '100%';
    document.getElementById('ansBox').style.display = 'block';
    
    reports.push({ en: w.en, ko: w.ko, ok: false });
    addWrongWord(w);
    if (qSide === 'ko') speak(w.en);
    return;
  }

  let ok = false;
  let bestTarget = targetAnswer;

  if (qSide === 'en') {
    const correctMeanings = w.ko.split(/[\/,]/).map(s => s.trim());
    ok = correctMeanings.some(mean => checkSimilarity(rawVal, mean));
    bestTarget = correctMeanings[0];
  } else {
    ok = checkSimilarity(rawVal, w.en);
  }

  lock = true;
  document.getElementById('checkBtn').style.display = 'none';
  inp.disabled = true;

  const isExact = (cleanText(rawVal) === cleanText(bestTarget));

  if (ok && isExact) {
    inp.classList.add('correct'); 
    playBeep(true); 
    reports.push({ en: w.en, ko: w.ko, ok: true });
  } else {
    inp.classList.add(ok ? 'correct' : 'wrong'); 
    playBeep(ok); 
    reports.push({ en: w.en, ko: w.ko, ok: ok });
    if (!ok) addWrongWord(w);

    const diff = getCharDiff(rawVal, bestTarget);
    if (diffArea) {
      diffArea.innerHTML = `
        <div class="diff-box">
          <div class="diff-row">
            <div class="diff-label">입력한 내용 (틀린 부분 표시):</div>
            <div class="diff-text">${diff.userHtml}</div>
          </div>
          <div class="diff-row" style="margin-top:8px;">
            <div class="diff-label">정답 단어 (누락된 철자 표시):</div>
            <div class="diff-text">${diff.targetHtml}</div>
          </div>
        </div>
      `;
    }
    if (!ok && qSide === 'ko') speak(w.en);
  }

  document.getElementById('ansBox').style.width = '100%';
  document.getElementById('ansBox').style.display = 'block';
}

function handleQuizSelect(element, selectedOption, correctOption) {
  if (lock) return;
  lock = true;
  
  if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
  
  const isCorrect = (selectedOption === correctOption);
  element.classList.add(isCorrect ? 'correct' : 'wrong');
  playBeep(isCorrect);
  
  if (!isCorrect) {
    document.getElementById('correctOpt')?.classList.add('reveal');
    addWrongWord(currentWords[idx]);
  }

  reports.push({ en: currentWords[idx].en, ko: currentWords[idx].ko, ok: isCorrect });

  const area = document.getElementById('gameArea');
  const nextBtnBox = document.createElement('div');
  nextBtnBox.style.marginTop = "16px";
  nextBtnBox.innerHTML = `<button class="action-btn" style="background:var(--green);" onclick="clearTimeout(quizTimer); moveNext();">다음 →</button>`;
  area.appendChild(nextBtnBox);
  
  if (!isCorrect && modeType === 'quiz_ko_en') speak(currentWords[idx].en);

  if (isCorrect) {
    quizTimer = setTimeout(moveNext, 2000);
  }
}

function handleQuizTimeout() {
  if (lock) return;
  lock = true;
  
  if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
  
  const hintEl = document.getElementById('timerHint');
  if (hintEl) {
    hintEl.textContent = "제한시간 초과! 오답 처리되었습니다.";
    hintEl.style.color = "var(--red)";
  }
  
  playBeep(false);
  document.getElementById('correctOpt')?.classList.add('reveal');
  
  reports.push({ en: currentWords[idx].en, ko: currentWords[idx].ko, ok: false });
  addWrongWord(currentWords[idx]);
  
  const area = document.getElementById('gameArea');
  const nextBtnBox = document.createElement('div');
  nextBtnBox.style.marginTop = "16px";
  nextBtnBox.innerHTML = `<button class="action-btn" style="background:var(--green);" onclick="moveNext()">다음 →</button>`;
  area.appendChild(nextBtnBox);
  
  if (modeType === 'quiz_ko_en') speak(currentWords[idx].en);
}

function moveNext() {
  if (quizTimer) { clearTimeout(quizTimer); quizTimer = null; }
  if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
  if (reports.length <= idx) return; 
  idx++;
  if (idx < currentWords.length) { renderQ(); }
  else { showResult(); }
}

function showResult() {
  if (quizTimer) { clearTimeout(quizTimer); quizTimer = null; }
  if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
  showScreen('resultScreen');
  
  const trueAnswersCount = reports.filter(r => r.ok).length;
  const pct = Math.round((trueAnswersCount / currentWords.length) * 100);
  
  document.getElementById('resPct').textContent = pct+'%';
  document.getElementById('resScore').textContent = `${trueAnswersCount} / ${currentWords.length} 정답`;
  document.getElementById('reportTable').innerHTML = reports.map(r =>
    `<tr><td>${r.en}</td><td style="color:var(--text2);font-size:12px">${r.ko}</td><td class="${r.ok?'ok':'ng'}">${r.ok?'○':'×'}</td></tr>`
  ).join('');

  // 틀린 단어 재학습 버튼 렌더링
  const wrongPool = reports.filter(r => !r.ok).map(r => ({ en: r.en, ko: r.ko }));
  const retryBox = document.getElementById('retryWrongBox');
  if (wrongPool.length > 0) {
    retryBox.innerHTML = `<button class="action-btn" style="background:#DC2626;" onclick="startMode('${modeType}', ${JSON.stringify(wrongPool).replace(/"/g, '&quot;')})">🚨 오답 (${wrongPool.length}개)만 다시 풀기</button>`;
  } else {
    retryBox.innerHTML = '';
  }
}

window.onload = function() {
  renderTabs();
  updateHomeSubCount();
};
renderTabs();
updateHomeSubCount();
</script>
